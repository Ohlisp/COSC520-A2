[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cosc520-a2"
version = "0.1.0"
description = "Range minimum query implementations and benchmarks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "_base",
    "benchmark_core",
    "benchmark_report",
    "brute_force",
    "memory_probe",
    "segment_tree",
    "sparse_table",
    "sqrt_decomposition",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
